# =============================================================================
# MODELE « CI VenaLabs » — convention D-099 / D-101
# =============================================================================
# Tous les evenements se verifient sur les runners auto-heberges de
# l'organisation (labels `venalabs-ci`, sans minutes GitHub).
#
# A ADAPTER a la stack du depot : remplacer l'etape finale par les vrais
# lint/build/tests. Regles completes :
# VenaLabs-Officiel/venalabs-ia -> docs/handoff-runners-ci.md §8.
# ⚠️ Ne pas dimensionner le parallelisme des tests sur les CPU "vus" : les
# machines sont PARTAGEES (plafonner les workers, cf. §8.3).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [$default-branch]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    runs-on: [self-hosted, venalabs-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: A remplacer par la vraie verification
        run: |
          echo "Adapter ce modele : lint + build + tests de la stack du depot."
          exit 1  # un modele non adapte ne doit pas rendre un faux vert
